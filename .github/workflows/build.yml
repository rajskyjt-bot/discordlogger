name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "discord-logger-template-1.16.5/gradlew" ]; then
            chmod +x discord-logger-template-1.16.5/gradlew
            cd discord-logger-template-1.16.5 && ./gradlew build
          else
            chmod +x gradlew
            ./gradlew build
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discordlogger-mod-1.16.5
          path: |
            discord-logger-template-1.16.5/build/libs/*.jar
            build/libs/*.jar
